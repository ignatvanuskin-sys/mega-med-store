<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Каталог стоматологических товаров — MegaMedStom Astana</title>
<meta name="description" content="Каталог стоматологических материалов, инструментов и оборудования: композиты, анестезия, боры, перчатки, дезинфекция. Поиск по названию, бренду и артикулу. Астана, доставка по Казахстану.">
<link rel="canonical" href="https://mega-med-store.vercel.app/catalog.html">
<meta property="og:type" content="website">
<meta property="og:locale" content="ru_RU">
<meta property="og:site_name" content="MegaMedStom Astana">
<meta property="og:title" content="Каталог стоматологических товаров — MegaMedStom Astana">
<meta property="og:description" content="Композиты, анестезия, боры, перчатки, дезинфекция: цены, наличие, доставка по Казахстану.">
<meta property="og:url" content="https://mega-med-store.vercel.app/catalog.html">
<meta name="theme-color" content="#F5F5F2">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Spectral:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css?v=20261017i">
<link rel="stylesheet" href="css/shop.css?v=20261017i">
<link rel="stylesheet" href="css/premium.css?v=20261017i">
<link rel="stylesheet" href="css/themes.css?v=20261017i">
</head>
<body class="has-bottom-nav" data-page="catalog">
<a class="skip-link" href="#main">Перейти к содержанию</a>
<div class="page">
  <div id="chromeTop"></div>
  <main id="main" class="page__main">
    <div class="wrap catalog">
      <nav class="crumbs" id="crumbs" aria-label="Хлебные крошки"></nav>
      <div class="catalog__head">
        <h1 class="h2" id="catTitle">Каталог товаров</h1>
        <div class="catalog__count" id="catCount"></div>
      </div>

      <div class="chiprow chiprow--mobile" id="catChips"></div>

      <div class="catalog__layout">
        <aside class="filters" id="filtersDesk" aria-label="Фильтры"></aside>
        <div class="catalog__content">
          <div class="ctoolbar">
            <button class="ctoolbar__filters" id="filtersBtn" type="button">
              <span data-icon="filter" data-isize="16"></span>Фильтры
              <span class="cnt" id="filterCount" hidden>0</span>
            </button>
            <span class="ctoolbar__count" id="toolbarCount"></span>
            <div class="ctoolbar__sort"><select class="select" id="sortSel" aria-label="Сортировка"></select></div>
          </div>

          <div class="activechips" id="activeChips"></div>
          <div class="chiprow" id="subChips" hidden></div>

          <h2 class="visually-hidden">Товары</h2>
          <div class="grid-products" id="grid"></div>
          <div class="catalog__foot" id="foot" hidden>
            <button class="btn btn--ghost" id="moreBtn" type="button">Показать ещё</button>
            <span class="catalog__showing" id="showing"></span>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div id="chromeFooter"></div>
</div>
<div id="bottomNav"></div>

<!-- Шторка фильтров (мобильные) -->
<div class="sheet" id="filtersSheet">
  <div class="sheet__grip"><i></i></div>
  <div class="sheet__head">
    <div class="sheet__title">Фильтры</div>
    <button class="sheet__close" type="button" data-close-sheet aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="sheet__body" id="filtersSheetBody"></div>
  <div class="sheet__foot">
    <button class="btn btn--ghost" id="resetBtn2" type="button">Сбросить</button>
    <button class="btn btn--primary" id="applyBtn" type="button">Показать товары</button>
  </div>
</div>

<script src="js/base.js?v=20261017i"></script>
<script src="js/art.js?v=20261017i"></script>
<script src="js/data.js?v=20261017i"></script>
<script src="js/store.js?v=20261017i"></script>
<script src="js/search.js?v=20261017i"></script>
<script src="js/ui.js?v=20261017i"></script>
<script>
MMS.ui.init({ page: "catalog" });
(function () {
  var U = MMS.ui, Q = MMS.search, esc = MMS.fmt.escape;
  var $ = U.$;
  var PAGE = 24;
  var f = Q.fromParams(new URLSearchParams(location.search));
  var shown = PAGE;

  var grid = $("#grid"), foot = $("#foot"), showing = $("#showing"),
      titleEl = $("#catTitle"), countEl = $("#catCount"), crumbsEl = $("#crumbs"),
      sortSel = $("#sortSel"), activeChips = $("#activeChips"), subChips = $("#subChips"),
      toolbarCount = $("#toolbarCount"), filterCount = $("#filterCount"),
      desk = $("#filtersDesk"), sheetBody = $("#filtersSheetBody");

  function curCat() { return MMS.CATEGORIES.filter(function (c) { return c.slug === f.cat; })[0] || null; }
  function curSub() { var c = curCat(); if (!c || !f.sub) return null; return c.subs.filter(function (s) { return s.slug === f.sub; })[0] || null; }

  function opt() {
    return { q: f.q, cat: f.cat, sub: f.sub, brands: f.brands, pmin: f.pmin, pmax: f.pmax, onlyNew: f.onlyNew, onlyStock: f.onlyStock, sort: f.sort };
  }

  /* ---------- заголовок, крошки, счётчики ---------- */
  function renderHead(total) {
    var c = curCat(), s = curSub();
    var name = f.q ? "Поиск: «" + f.q + "»" : (c ? c.name : "Каталог товаров");
    if (s) name = s.name + " — " + (c ? c.name : "");
    titleEl.textContent = name;
    document.title = name + " — MegaMedStom Astana";
    /* SEO: canonical и description под текущую выборку каталога */
    var canon = "https://mega-med-store.vercel.app/catalog.html";
    var cparams = [];
    if (c) cparams.push("cat=" + c.slug);
    if (s) cparams.push("sub=" + s.slug);
    if (f.q) cparams.push("q=" + encodeURIComponent(f.q));
    if (cparams.length) canon += "?" + cparams.join("&");
    var cnEl = document.querySelector('link[rel="canonical"]');
    if (cnEl) cnEl.href = canon;
    var mdEl = document.querySelector('meta[name="description"]');
    if (mdEl) mdEl.setAttribute("content", name + " — MegaMedStom Astana. Цены и наличие, самовывоз в Астане (ул. Айнакол, 66), доставка по Казахстану.");
    var ogTitle = document.querySelector('meta[property="og:title"]');
    if (ogTitle) ogTitle.setAttribute("content", name + " — MegaMedStom Astana");
    var ogUrl = document.querySelector('meta[property="og:url"]');
    if (ogUrl) ogUrl.setAttribute("content", canon);
    var cr = '<ol style="display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center">';
    cr += '<li><a href="index.html">Главная</a></li>';
    cr += c ? '<li><a href="catalog.html">Каталог</a></li>' : '<li>Каталог</li>';
    if (c) cr += s ? '<li><a href="catalog.html?cat=' + c.slug + '">' + esc(c.name) + "</a></li>" : "<li>" + esc(c.name) + "</li>";
    if (s) cr += "<li>" + esc(s.name) + "</li>";
    cr += "</ol>";
    crumbsEl.innerHTML = cr;
    countEl.textContent = total + " " + MMS.fmt.goodsWord(total) + (c ? " в категории" : " в каталоге");
  }

  /* ---------- панель фильтров ---------- */
  function filtersHtml() {
    var c = curCat();
    var catsHtml = '<div class="fblock"><div class="fblock__title">Категории</div><div class="fcats">' +
      '<a href="catalog.html' + (f.q ? "?q=" + encodeURIComponent(f.q) : "") + '" class="' + (!f.cat ? "is-active" : "") + '">Все категории</a>' +
      MMS.CATEGORIES.map(function (x) {
        var n = Q.query(f.q, { cat: x.slug }).length;
        return '<a href="catalog.html?cat=' + x.slug + (f.q ? "&q=" + encodeURIComponent(f.q) : "") + '" class="' + (f.cat === x.slug ? "is-active" : "") + '">' + esc(x.name) + "<i>" + n + "</i></a>";
      }).join("") + "</div></div>";

    var subsHtml = "";
    if (c) {
      subsHtml = '<div class="fblock"><div class="fblock__title">Подкатегории</div><div class="fcats">' +
        '<a href="#" data-fset-sub="1" class="' + (!f.sub ? "is-active" : "") + '">Все подкатегории</a>' +
        c.subs.map(function (s) {
          return '<a href="#" data-fset-sub="' + s.slug + '" class="' + (f.sub === s.slug ? "is-active" : "") + '">' + esc(s.name) + "</a>";
        }).join("") + "</div></div>";
    }

    var counts = Q.brandCounts({ q: f.q, cat: f.cat, sub: f.sub, pmin: f.pmin, pmax: f.pmax, onlyNew: f.onlyNew, onlyStock: f.onlyStock });
    var brands = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a] || a.localeCompare(b, "ru"); });
    var brandsHtml = '<div class="fblock"><div class="fblock__title">Производитель</div><div class="fcheck-scroll">' +
      brands.map(function (b) {
        var on = f.brands.indexOf(b) >= 0;
        return '<label class="fcheck"><input type="checkbox" data-fbrand="' + esc(b) + '"' + (on ? " checked" : "") + ">" + esc(b) + "<i>" + counts[b] + "</i></label>";
      }).join("") + "</div></div>";

    var rng = Q.priceRange({ q: f.q, cat: f.cat, sub: f.sub, onlyNew: f.onlyNew, onlyStock: f.onlyStock });
    var priceHtml = '<div class="fblock"><div class="fblock__title">Цена, ₸</div>' +
      '<div class="fprice"><input class="input" type="number" inputmode="numeric" id="fPmin" aria-label="Цена от" placeholder="от ' + MMS.fmt.num(rng.min) + '" value="' + (f.pmin != null ? f.pmin : "") + '">' +
      "<span>—</span>" +
      '<input class="input" type="number" inputmode="numeric" id="fPmax" aria-label="Цена до" placeholder="до ' + MMS.fmt.num(rng.max) + '" value="' + (f.pmax != null ? f.pmax : "") + '"></div>' +
      '<button class="btn btn--ghost btn--sm btn--block mt-1" type="button" data-fapply-price="1">Применить цену</button></div>';

    var toggleHtml = '<div class="fblock"><div class="fblock__title">Показывать</div><div class="stack">' +
      '<label class="ftoggle"><input type="checkbox" data-fnew="1"' + (f.onlyNew ? " checked" : "") + ">Только новинки</label>" +
      '<label class="ftoggle"><input type="checkbox" data-fstock="1"' + (f.onlyStock ? " checked" : "") + ">Только позиции с ценой</label>" +
      "</div></div>";

    return catsHtml + subsHtml + brandsHtml + priceHtml + toggleHtml;
  }

  function renderFilters() {
    desk.innerHTML = filtersHtml();
    sheetBody.innerHTML = filtersHtml();
  }

  /* ---------- чипы категорий (моб.) и подкатегорий ---------- */
  function renderChips() {
    $("#catChips").innerHTML = '<a class="chip' + (!f.cat ? " is-active" : "") + '" href="catalog.html' + (f.q ? "?q=" + encodeURIComponent(f.q) : "") + '">Все</a>' +
      MMS.CATEGORIES.map(function (x) {
        return '<a class="chip' + (f.cat === x.slug ? " is-active" : "") + '" href="catalog.html?cat=' + x.slug + '">' + esc(x.name) + "</a>";
      }).join("");
    var c = curCat();
    if (!c) { subChips.hidden = true; subChips.innerHTML = ""; return; }
    subChips.hidden = false;
    subChips.innerHTML = '<a class="chip' + (!f.sub ? " is-active" : "") + '" href="#" data-fset-sub="1">Все</a>' +
      c.subs.map(function (s) {
        return '<a class="chip' + (f.sub === s.slug ? " is-active" : "") + '" href="#" data-fset-sub="' + s.slug + '">' + esc(s.name) + "</a>";
      }).join("");
  }

  /* ---------- активные фильтры ---------- */
  function renderActive() {
    var out = [];
    f.brands.forEach(function (b) { out.push('<span class="achip">' + esc(b) + '<button type="button" data-fdel-brand="' + esc(b) + '" aria-label="Убрать фильтр">' + MMS.icon("x", 12) + "</button></span>"); });
    if (f.pmin != null || f.pmax != null) out.push('<span class="achip">Цена: ' + (f.pmin != null ? "от " + MMS.fmt.num(f.pmin) : "") + (f.pmin != null && f.pmax != null ? " " : "") + (f.pmax != null ? "до " + MMS.fmt.num(f.pmax) : "") + '<button type="button" data-fdel-price="1" aria-label="Убрать фильтр">' + MMS.icon("x", 12) + "</button></span>");
    if (f.onlyNew) out.push('<span class="achip">Только новинки<button type="button" data-fdel-new="1" aria-label="Убрать фильтр">' + MMS.icon("x", 12) + "</button></span>");
    if (f.onlyStock) out.push('<span class="achip">Только с ценой<button type="button" data-fdel-stock="1" aria-label="Убрать фильтр">' + MMS.icon("x", 12) + "</button></span>");
    if (out.length) out.push('<button type="button" class="activechips__reset" data-freset="1">Сбросить всё</button>');
    activeChips.innerHTML = out.join("");
    var n = Q.activeCount(f);
    filterCount.textContent = n; filterCount.hidden = !n;
  }

  /* ---------- сортировка ---------- */
  function renderSort() {
    var opts = [
      ["popular", "По популярности"],
      ["priceAsc", "Сначала дешёвые"],
      ["priceDesc", "Сначала дорогие"],
      ["name", "По названию"],
      ["new", "Сначала новинки"]
    ];
    if (f.q) opts.unshift(["relevance", "По релевантности"]);
    sortSel.innerHTML = opts.map(function (o) { return '<option value="' + o[0] + '">' + o[1] + "</option>"; }).join("");
    sortSel.value = f.sort || (f.q ? "relevance" : "popular");
  }

  /* ---------- товары ---------- */
  function renderGrid() {
    var items = Q.query(f.q, opt());
    renderHead(items.length);
    toolbarCount.textContent = items.length + " " + MMS.fmt.goodsWord(items.length);
    var part = items.slice(0, shown);
    grid.innerHTML = part.map(U.productCard).join("");
    if (!items.length) {
      grid.innerHTML = U.emptyState({
        icon: "search",
        title: "Ничего не найдено",
        text: "Попробуйте изменить фильтры, написание или посмотрите другой раздел каталога.",
        cta: { href: "catalog.html", label: "Сбросить фильтры" }
      });
    }
    if (items.length > PAGE) {
      foot.hidden = false;
      showing.textContent = "Показано " + part.length + " из " + items.length;
      const moreBtn = $("#moreBtn");
      if (shown < items.length) {
        moreBtn.hidden = false;
        moreBtn.textContent = "Показать ещё " + Math.min(PAGE, items.length - shown);
      } else {
        moreBtn.hidden = true;
      }
    } else {
      foot.hidden = true;
    }
    U.syncCards();
  }

  function syncUrl() {
    var qs = Q.toParams(f);
    history.replaceState(null, "", "catalog.html" + (qs ? "?" + qs : ""));
    renderFilters(); renderChips(); renderActive();
  }

  function full() { renderGrid(); renderSort(); syncUrl(); }

  /* ---------- события ---------- */
  document.addEventListener("click", function (e) {
    var sub = e.target.closest("[data-fset-sub]");
    if (sub) { e.preventDefault(); var v = sub.getAttribute("data-fset-sub"); f.sub = v === "1" ? "" : v; shown = PAGE; full(); return; }
    var bp = e.target.closest("[data-fapply-price]");
    if (bp) {
      var mn = parseInt($("#fPmin").value, 10); var mx = parseInt($("#fPmax").value, 10);
      f.pmin = isNaN(mn) ? null : mn; f.pmax = isNaN(mx) ? null : mx; shown = PAGE; full(); return;
    }
    var db = e.target.closest("[data-fdel-brand]");
    if (db) { var b = db.getAttribute("data-fdel-brand"); f.brands = f.brands.filter(function (x) { return x !== b; }); shown = PAGE; full(); return; }
    if (e.target.closest("[data-fdel-price]")) { f.pmin = null; f.pmax = null; shown = PAGE; full(); return; }
    if (e.target.closest("[data-fdel-new]")) { f.onlyNew = false; shown = PAGE; full(); return; }
    if (e.target.closest("[data-fdel-stock]")) { f.onlyStock = false; shown = PAGE; full(); return; }
    if (e.target.closest("[data-freset]") || e.target.closest("#resetBtn2")) {
      /* сброс всех фильтров, поисковый запрос сохраняем */
      f = { q: f.q, cat: "", sub: "", brands: [], pmin: null, pmax: null, onlyNew: false, onlyStock: false, sort: "" };
      shown = PAGE; full(); return;
    }
    if (e.target.closest("#filtersBtn")) { U.openSheet($("#filtersSheet")); return; }
    if (e.target.closest("#applyBtn")) { U.closeSheets(); return; }
    if (e.target.closest("#moreBtn")) { shown += PAGE; renderGrid(); return; }
  });

  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t === sortSel) { f.sort = t.value; shown = PAGE; full(); return; }
    if (t.matches("[data-fbrand]")) {
      var b = t.getAttribute("data-fbrand");
      if (t.checked) { if (f.brands.indexOf(b) < 0) f.brands.push(b); }
      else f.brands = f.brands.filter(function (x) { return x !== b; });
      shown = PAGE; full(); return;
    }
    if (t.matches("[data-fnew]")) { f.onlyNew = t.checked; shown = PAGE; full(); return; }
    if (t.matches("[data-fstock]")) { f.onlyStock = t.checked; shown = PAGE; full(); return; }
  });

  /* Enter в полях цены */
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target && e.target.matches("#fPmin, #fPmax")) {
      e.preventDefault();
      var btn = document.querySelector("[data-fapply-price]");
      if (btn) btn.click();
    }
  });

  /* ---------- старт: скелетон, затем рендер ---------- */
  U.skeletonGrid(grid, 8);
  renderSort(); renderFilters(); renderChips(); renderActive();
  setTimeout(function () { renderGrid(); syncUrl(); }, 220);
})();
</script>
</body>
</html>
